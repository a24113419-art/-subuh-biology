
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071510">
  <title>سُبُح | عالم الحياة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071510;
      color: #f3f5e9;
      text-align: center;
    }
    header {
      padding: 22px;
      border-bottom: 1px solid #244638;
      color: #d9c58b;
      letter-spacing: 2px;
    }
    main { padding: 65px 20px; }
    .planet {
      font-size: 75px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 42px;
      color: #d9c58b;
      margin: 10px;
    }
    p {
      color: #b8c9bd;
      line-height: 1.9;
    }
    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 28px;
      background: #bca66c;
      color: #071510;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
    .card {
      margin: 35px auto;
      padding: 22px;
      max-width: 420px;
      border: 1px solid #315543;
      border-radius: 16px;
      background: #10251b;
    }
    footer {
      padding: 25px;
      color: #849b8c;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>✦ سُبُح ✦</header>

  <main>
    <div class="planet">🌍</div>
    <h1>سُبُح</h1>
    <p>رحلتك لاكتشاف أسرار الحياة وعظمة الكون</p>
    <a class="button" href="#sections">ابدأ الاستكشاف</a>

    <section class="card" id="sections">
      <h2>عالم الأحياء</h2>
      <p>من الخلية الصغيرة إلى اتساع الكون، تبدأ المعرفة بسؤال.</p>
      <p>قريبًا: الأقسام التعليمية والاختبارات التفاعلية.</p>
    </section>
  </main>

  <footer>سُبُح · منصة تعليمية قيد التطوير</footer>
</body>
  </html>
